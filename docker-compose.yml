configs:
  apt_sources:
    file: './configs/debian.sources'
  ccache:
    file: './configs/ccache.conf'
name: 'mi9t-kernel'
services:
  build:
    build:
      additional_contexts:
        assets: './assets'
        configs: './configs'
      context: '.'
      target: 'source'
    configs:
      - source: 'apt_sources'
        target: '/etc/apt/sources.list.d/debian.sources'
      - source: 'ccache'
        target: '/etc/ccache.conf'
    environment:
      ANDROID_ADB_SERVER_ADDRESS: 'host.docker.internal'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    init: true
    volumes:
      - source: './out'
        target: '/home/build/src/out'
        type: 'bind'
      - source: 'src'
        target: '/home/build/src'
        type: 'volume'
volumes:
  src:
