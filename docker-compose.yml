configs:
  apt:
    file: './configs/debian.sources'
  ccache:
    file: './configs/ccache.conf'
name: 'docker-on-android'
services:
  build:
    build:
      additional_contexts:
        configs: './configs'
      context: '.'
      target: 'source'
    cap_add:
     - 'CAP_MKNOD'
     - 'SYS_ADMIN'
    configs:
      - source: 'apt'
        target: '/etc/apt/sources.list.d/debian.sources'
      - source: 'ccache'
        target: '/etc/ccache.conf'
    environment:
      ANDROID_ADB_SERVER_ADDRESS: 'host.docker.internal'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    init: true
    volumes:
      - './out:/home/build/out'
      - 'workdir:/home/build/src/workdir'
volumes:
  workdir:
